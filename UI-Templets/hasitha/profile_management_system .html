<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Management - Student Attendance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --dark-light: #334155;
            --light: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-light: #64748b;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--shadow);
            overflow: hidden;
        }

        /* Header */
        .profile-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 30px 40px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-content h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header-content p {
            opacity: 0.9;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-edit {
            background: white;
            color: var(--primary);
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
        }

        .btn-save {
            background: var(--success);
            color: white;
        }

        .btn-cancel {
            background: transparent;
            color: white;
            border: 2px solid white;
        }

        /* User Type Selector */
        .user-type-selector {
            padding: 20px 40px;
            background: var(--light);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-type-selector label {
            font-weight: 600;
            color: var(--text);
        }

        .user-type-selector select {
            padding: 8px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-type-selector select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Completeness Bar */
        .completeness-bar {
            padding: 20px 40px;
            background: var(--light);
            border-bottom: 1px solid var(--border);
        }

        .completeness-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        .completeness-percent {
            color: var(--primary);
        }

        .completeness-track {
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .completeness-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* Tabs */
        .profile-tabs {
            display: flex;
            padding: 0 40px;
            background: white;
            border-bottom: 2px solid var(--border);
            overflow-x: auto;
        }

        .tab {
            padding: 20px 25px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--primary);
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Tab Content */
        .tab-content {
            padding: 40px;
            min-height: 400px;
        }

        /* Profile Section */
        .profile-section {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .profile-section {
                grid-template-columns: 1fr;
            }
        }

        .avatar-section {
            text-align: center;
        }

        .avatar-section label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: left;
        }

        .avatar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .avatar-large {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 600;
            color: white;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-actions {
            display: flex;
            gap: 10px;
        }

        .avatar-btn {
            padding: 8px 16px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .avatar-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .avatar-btn.danger:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* Form Section */
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .form-input, .form-select, .form-textarea {
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-value {
            padding: 12px 15px;
            background: var(--light);
            border-radius: 8px;
            color: var(--text);
            min-height: 44px;
            display: flex;
            align-items: center;
        }

        .form-value.bio {
            min-height: 100px;
            align-items: flex-start;
        }

        .subsection-header {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--border);
        }

        .subsection-header h3 {
            font-size: 18px;
            color: var(--text);
            margin-bottom: 20px;
        }

        /* Security Section */
        .security-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .security-card {
            padding: 25px;
            border: 2px solid var(--border);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .security-card:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.1);
        }

        .card-header {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .card-header svg {
            font-size: 24px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .card-header h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .card-header p {
            font-size: 13px;
            color: var(--text-light);
        }

        .card-action {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .card-action:hover {
            background: var(--primary-dark);
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Info Card */
        .info-card {
            grid-column: 1 / -1;
            padding: 25px;
            background: var(--light);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 14px;
            color: var(--text-light);
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-badge.active {
            background: #dcfce7;
            color: #16a34a;
        }

        .status-badge.inactive {
            background: #fee2e2;
            color: #dc2626;
        }

        .verified-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--success);
            font-weight: 600;
        }

        /* Activity Section */
        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .activity-item {
            display: flex;
            gap: 15px;
            padding: 20px;
            border: 2px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s;
        }

        .activity-item:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.1);
        }

        .activity-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            flex-shrink: 0;
        }

        .activity-icon.login {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .activity-icon.edit {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .activity-icon.security {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .activity-details h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .activity-details p {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .activity-time {
            font-size: 12px;
            color: var(--text-light);
        }

        /* Preferences Section */
        .pref-grid {
            display: grid;
            gap: 30px;
        }

        .pref-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pref-card label {
            font-size: 14px;
            font-weight: 600;
        }

        .notif-section {
            margin-top: 20px;
        }

        .notif-section h3 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notif-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border: 2px solid var(--border);
            border-radius: 12px;
        }

        .notif-info {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .notif-info svg {
            font-size: 24px;
            color: var(--primary);
        }

        .notif-info h4 {
            font-size: 15px;
            margin-bottom: 3px;
        }

        .notif-info p {
            font-size: 13px;
            color: var(--text-light);
        }

        /* Privacy Section */
        .privacy-grid {
            display: grid;
            gap: 25px;
        }

        .privacy-card {
            padding: 25px;
            border: 2px solid var(--border);
            border-radius: 12px;
        }

        .privacy-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .privacy-card p {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 15px;
        }

        .privacy-toggles {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .privacy-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--light);
            border-radius: 8px;
        }

        /* Danger Zone */
        .danger-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .danger-card {
            padding: 25px;
            border: 2px solid #fecaca;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .danger-card.severe {
            border-color: var(--danger);
            background: #fef2f2;
        }

        .danger-header {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .danger-header svg {
            font-size: 24px;
            color: var(--danger);
            flex-shrink: 0;
        }

        .danger-header h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .danger-header p {
            font-size: 13px;
            color: var(--text-light);
        }

        .danger-btn {
            padding: 10px 20px;
            background: transparent;
            color: var(--danger);
            border: 2px solid var(--danger);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .danger-btn:hover {
            background: var(--danger);
            color: white;
        }

        .danger-btn.severe {
            background: var(--danger);
            color: white;
        }

        .danger-btn.severe:hover {
            background: #dc2626;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: white;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 25px;
            border-bottom: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 20px;
        }

        .modal-header.danger {
            color: var(--danger);
            display: flex;
            gap: 10px;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--light);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: var(--border);
        }

        .modal-content {
            padding: 25px;
        }

        .password-input {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-light);
            padding: 5px;
        }

        .password-strength {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .strength-bar {
            flex: 1;
            height: 6px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            transition: all 0.3s;
            border-radius: 10px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .modal-actions .cancel-btn {
            background: var(--light);
            color: var(--text);
        }

        .modal-actions .save-btn {
            background: var(--primary);
            color: white;
        }

        .modal-actions .delete-btn {
            background: var(--danger);
            color: white;
        }

        .warning-text {
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .warning-text strong {
            color: var(--danger);
        }

        /* Avatar Modal */
        .avatar-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .avatar-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--border);
        }

        .avatar-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }

        .upload-btn {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        /* Sessions Modal */
        .sessions-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .session-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 12px;
            align-items: center;
        }

        .session-item.current {
            border-color: var(--primary);
            background: #f0f4ff;
        }

        .session-item svg {
            font-size: 24px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .session-info {
            flex: 1;
        }

        .session-info h4 {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .session-info p {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 3px;
        }

        .session-info span {
            font-size: 12px;
            color: var(--text-light);
        }

        .current-badge {
            padding: 4px 12px;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .logout-btn {
            padding: 8px 16px;
            background: transparent;
            color: var(--danger);
            border: 2px solid var(--danger);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .logout-all-btn {
            width: 100%;
            padding: 12px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .hidden {
            display: none;
        }

        /* Icons (Using Unicode) */
        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="profile-header">
            <div class="header-content">
                <h1>My Profile</h1>
                <p>Manage your account settings and preferences</p>
            </div>
            <div class="header-actions" id="headerActions">
                <button class="btn btn-edit" onclick="toggleEdit()">
                    ✏️ Edit Profile
                </button>
            </div>
        </div>

        <!-- User Type Selector (Demo) -->
        <div class="user-type-selector">
            <label>Demo User Type:</label>
            <select id="userTypeSelect" onchange="changeUserType()">
                <option value="student">Student</option>
                <option value="lecturer">Lecturer</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <!-- Completeness Bar -->
        <div class="completeness-bar">
            <div class="completeness-header">
                <span>Profile Completeness</span>
                <span class="completeness-percent" id="completenessPercent">75%</span>
            </div>
            <div class="completeness-track">
                <div class="completeness-fill" id="completenessFill" style="width: 75%"></div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="profile-tabs">
            <button class="tab active" onclick="switchTab('profile')">
                👤 <span>Profile</span>
            </button>
            <button class="tab" onclick="switchTab('security')">

                            </svg>
                            <div>
                                <h3>Delete Account</h3>
                                <p>Permanently delete your account and all data</p>
                            </div>
                        </div>
                        <button class="danger-btn severe" onclick="showDeleteModal()">Delete Account</button>
                    </div>
                </div>
            `;
        }

        // Modal Functions
        function showPasswordModal() {
            document.getElementById('modals').innerHTML = `
                <div class="modal-overlay" onclick="closeModal()">
                    <div class="modal" onclick="event.stopPropagation()">
                        <div class="modal-header">
                            <h2>Change Password</h2>
                            <button class="close-btn" onclick="closeModal()">✕</button>
                        </div>
                        <div class="modal-content">
                            <div class="form-group">
                                <label>Current Password</label>
                                <div class="password-input">
                                    <input type="password" class="form-input" id="currentPass" placeholder="Enter current password">
                                    <button class="password-toggle" onclick="togglePassword('currentPass')">👁️</button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>New Password</label>
                                <div class="password-input">
                                    <input type="password" class="form-input" id="newPass" placeholder="Enter new password" oninput="updatePasswordStrength()">
                                    <button class="password-toggle" onclick="togglePassword('newPass')">👁️</button>
                                </div>
                                <div class="password-strength">
                                    <div class="strength-bar">
                                        <div class="strength-fill" id="strengthFill" style="width: 0%; background: #ccc;"></div>
                                    </div>
                                    <span id="strengthLabel" style="font-size: 12px; color: #64748b;">No password</span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Confirm New Password</label>
                                <div class="password-input">
                                    <input type="password" class="form-input" id="confirmPass" placeholder="Confirm new password">
                                    <button class="password-toggle" onclick="togglePassword('confirmPass')">👁️</button>
                                </div>
                            </div>
                            <div class="modal-actions">
                                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                                <button class="save-btn" onclick="updatePassword()">Update Password</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showAvatarModal() {
            document.getElementById('modals').innerHTML = `
                <div class="modal-overlay" onclick="closeModal()">
                    <div class="modal" onclick="event.stopPropagation()">
                        <div class="modal-header">
                            <h2>Change Profile Picture</h2>
                            <button class="close-btn" onclick="closeModal()">✕</button>
                        </div>
                        <div class="modal-content avatar-content">
                            <div class="avatar-preview">
                                <div class="avatar-placeholder">📷</div>
                            </div>
                            <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="previewAvatar(event)">
                            <label for="avatarInput" class="upload-btn">
                                📷 Choose Photo
                            </label>
                            <div class="modal-actions">
                                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                                <button class="save-btn" onclick="uploadAvatar()">Upload</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showDeleteModal() {
            document.getElementById('modals').innerHTML = `
                <div class="modal-overlay" onclick="closeModal()">
                    <div class="modal" onclick="event.stopPropagation()">
                        <div class="modal-header danger">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="12"></line>
                                <line x1="12" y1="16" x2="12.01" y2="16"></line>
                            </svg>
                            <h2>Delete Account</h2>
                        </div>
                        <div class="modal-content">
                            <p class="warning-text">
                                This action is <strong>permanent</strong> and cannot be undone.
                                All your data will be permanently deleted.
                            </p>
                            <div class="form-group">
                                <label>Type "DELETE" to confirm</label>
                                <input type="text" class="form-input" id="deleteConfirm" placeholder="DELETE">
                            </div>
                            <div class="modal-actions">
                                <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                                <button class="delete-btn" onclick="deleteAccount()">Delete My Account</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function showSessionsModal() {
            document.getElementById('modals').innerHTML = `
                <div class="modal-overlay" onclick="closeModal()">
                    <div class="modal" onclick="event.stopPropagation()">
                        <div class="modal-header">
                            <h2>Active Sessions</h2>
                            <button class="close-btn" onclick="closeModal()">✕</button>
                        </div>
                        <div class="modal-content">
                            <div class="sessions-list">
                                <div class="session-item current">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                        <line x1="8" y1="21" x2="16" y2="21"></line>
                                        <line x1="12" y1="17" x2="12" y2="21"></line>
                                    </svg>
                                    <div class="session-info">
                                        <h4>Chrome on Windows</h4>
                                        <p>Colombo, Sri Lanka • 192.168.1.1</p>
                                        <span>Current session</span>
                                    </div>
                                    <span class="current-badge">Active</span>
                                </div>

                                <div class="session-item">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                        <line x1="8" y1="21" x2="16" y2="21"></line>
                                        <line x1="12" y1="17" x2="12" y2="21"></line>
                                    </svg>
                                    <div class="session-info">
                                        <h4>Firefox on MacOS</h4>
                                        <p>Kandy, Sri Lanka • 192.168.1.2</p>
                                        <span>Last active: 2 days ago</span>
                                    </div>
                                    <button class="logout-btn">Logout</button>
                                </div>
                            </div>

                            <button class="logout-all-btn">
                                🚪 Logout from all devices
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modals').innerHTML = '';
        }

        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function updatePasswordStrength() {
            const password = document.getElementById('newPass').value;
            const fill = document.getElementById('strengthFill');
            const label = document.getElementById('strengthLabel');

            let strength = 0;
            let text = 'No password';
            let color = '#ccc';

            if (password.length === 0) {
                strength = 0;
                text = 'No password';
                color = '#ccc';
            } else if (password.length < 6) {
                strength = 25;
                text = 'Weak';
                color = '#ef4444';
            } else if (password.length < 10) {
                strength = 50;
                text = 'Fair';
                color = '#f59e0b';
            } else if (password.length < 14) {
                strength = 75;
                text = 'Good';
                color = '#8b5cf6';
            } else {
                strength = 100;
                text = 'Strong';
                color = '#10b981';
            }

            fill.style.width = strength + '%';
            fill.style.background = color;
            label.textContent = text;
            label.style.color = color;
        }

        function previewAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.querySelector('.avatar-preview').innerHTML = `
                        <img src="${e.target.result}" alt="Preview" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover;">
                    `;
                };
                reader.readAsDataURL(file);
            }
        }

        function updatePassword() {
            const current = document.getElementById('currentPass').value;
            const newPass = document.getElementById('newPass').value;
            const confirm = document.getElementById('confirmPass').value;

            if (!current || !newPass || !confirm) {
                alert('Please fill all fields');
                return;
            }

            if (newPass !== confirm) {
                alert('New passwords do not match');
                return;
            }

            alert('Password updated successfully!');
            closeModal();
        }

        function uploadAvatar() {
            alert('Avatar uploaded successfully!');
            closeModal();
        }

        function deleteAccount() {
            const confirm = document.getElementById('deleteConfirm').value;
            if (confirm === 'DELETE') {
                alert('Account deleted successfully!');
                closeModal();
            } else {
                alert('Please type DELETE to confirm');
            }
        }
    </script>
</body>
</html>
